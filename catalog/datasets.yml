# Datasets published on the site. Schema and vocabulary: catalog/README.md
# `id` = path under data/processed/ without .csv

datasets:
  - id: national/final_energy_by_carrier
    title: Final energy consumption by carrier
    description: Energy delivered to end users, by energy carrier. "Other renewables" includes ambient heat, solar thermal, biogas and biofuels.
    source: bfe_energy_statistics
    chart: stacked-area
    status: official
    coverage: national

  - id: national/final_energy_by_sector
    title: Final energy consumption by sector
    description: Energy delivered to end users, by consuming sector. Agriculture is reported together with the statistical difference.
    source: bfe_energy_statistics
    chart: stacked-bar
    status: official
    coverage: national

  - id: national/gross_energy_by_source
    title: Gross energy consumption by source
    description: All energy used in Switzerland before conversion, including nuclear fuel and hydropower. The electricity trade balance is negative in years of net exports.
    source: bfe_energy_statistics
    chart: stacked-bar
    status: official
    coverage: national

  - id: national/supply_domestic_vs_imports
    title: Energy supply, domestic production vs net imports
    description: Gross energy consumption split into domestic production (hydropower, wood, waste, other renewables) and net imports (imports minus exports, plus or minus stock changes). Nuclear fuel counts as imported.
    source: bfe_energy_statistics
    chart: stacked-bar
    status: official
    coverage: national

  - id: national/import_dependency
    title: Import dependency
    description: Share of gross energy consumption covered by net imports.
    source: bfe_energy_statistics
    chart: line
    status: official
    coverage: national

  - id: buildings/heating_energy_source
    title: Main heating energy source of residential buildings (share of number of buildings)
    description: Share of the number of existing residential buildings (one count per building, EGID, regardless of size or number of dwellings) by the energy source of their main heating system. Only buildings with a recorded source are included. Air, ground and water sources indicate heat pumps.
    source: bfs_gwr
    chart: hbar
    status: official
    coverage: national

  - id: buildings/buildings_by_construction_period
    title: Residential buildings by construction period
    description: Number of existing residential buildings by period of construction, where recorded.
    source: bfs_gwr
    chart: hbar
    status: official
    coverage: national

  # ---------- buildings: energy performance ----------
  - id: buildings/stock_energy_intensity
    title: Energy use per m² of the building stock
    description: Final energy for space heating and hot water in households and services, per m² of energy reference area (ERA), Switzerland. Includes the influence of weather (2021 was cold).
    source: bafu_cantonal_buildings_report
    chart: line
    status: official
    coverage: national

  - id: buildings/stock_co2_intensity
    title: Direct CO2 emissions per m² of the building stock
    description: Direct CO2 emissions from space heating and hot water in households and services, per m² of energy reference area, Switzerland.
    source: bafu_cantonal_buildings_report
    chart: line
    status: official
    coverage: national

  - id: buildings/stock_final_energy_by_carrier
    title: Final energy for heating and hot water by carrier
    description: Buildings of households and services, space heating and hot water, sum of cantonal reporting.
    source: bafu_cantonal_buildings_report
    chart: stacked-area
    status: official
    coverage: national

  - id: buildings/co2_class_distribution
    title: Estimated direct CO2 emissions of residential buildings (share of number of buildings)
    description: Share of the number of residential buildings by estimated direct CO2 emissions in kg CO2 per m² heated floor area and year. Modelled by FOEN for standard conditions (SIA 380/1) from GWR data, not measured; renovations are largely not captured.
    source: bafu_co2_buildings
    chart: hbar
    status: official
    coverage: national

  - id: buildings/geneva_heat_index
    title: Measured heat demand of buildings in Geneva (IDC)
    description: Floor-area-weighted mean heat energy index (space heating and hot water) of buildings that report under Geneva law, per m² heated floor area (SRE). Converted from MJ/m² (3.6 MJ = 1 kWh). Geneva only.
    source: ge_idc
    chart: line
    status: official
    coverage: regional
    region: Canton of Geneva

  - id: buildings/luzern_geak_envelope_class
    title: GEAK certificates in Lucerne by envelope class
    description: Energy performance certificates (GEAK) issued for existing buildings in the canton of Lucerne, by efficiency class of the building envelope (A best, G worst) and year issued. Certificates are voluntary or triggered by subsidies, so this is not a representative sample of the stock.
    source: lu_geak
    chart: stacked-bar
    palette: sequential
    status: official
    coverage: regional
    region: Canton of Lucerne

  - id: buildings/minergie_per_1000_buildings
    title: Minergie-certified buildings per 1,000 buildings, by canton
    description: Buildings with any Minergie label in the open dataset per 1,000 existing buildings (GWR). The open dataset holds about 33,000 buildings while Minergie reports about 60,500, so absolute levels are understated.
    source: minergie_buildings
    chart: hbar
    status: official
    coverage: national

  # ---------- buildings: retrofit ----------
  - id: buildings/gp_payouts_by_area
    title: Building Programme payouts by area
    description: Subsidies paid out by Das Gebäudeprogramm (federal and cantonal), by area of measure, sum of cantons.
    source: bfe_gebaeudeprogramm
    chart: stacked-bar
    status: official
    coverage: national

  - id: buildings/gp_energy_savings
    title: Ongoing energy savings from the Building Programme
    description: Annual energy savings in each year from all measures funded since 2010 that are still in effect, by area of measure (HFM 2015 method).
    source: bfe_gebaeudeprogramm
    chart: stacked-area
    status: official
    coverage: national

  - id: buildings/gp_co2_savings
    title: Ongoing CO2 reduction from the Building Programme
    description: Annual CO2 reduction in each year from all measures funded since 2010 that are still in effect, by area of measure.
    source: bfe_gebaeudeprogramm
    chart: stacked-area
    status: official
    coverage: national

  - id: buildings/gp_heating_replaced_old
    title: Subsidised heating replacements, by system removed
    description: Building Programme projects in which the main heating system changed, by the system before the measure and year of funding commitment.
    source: bfe_gebaeudeprogramm_projects
    chart: stacked-bar
    status: official
    coverage: national

  - id: buildings/gp_heating_replaced_new
    title: Subsidised heating replacements, by system installed
    description: The same projects, by the new main heating system. Air, ground and water heat pumps are grouped.
    source: bfe_gebaeudeprogramm_projects
    chart: stacked-bar
    status: official
    coverage: national

  - id: buildings/gp_insulated_area
    title: Envelope area insulated with Building Programme funding
    description: Insulated roof, facade and wall/floor area of subsidised projects, by year of funding commitment.
    source: bfe_gebaeudeprogramm_projects
    chart: stacked-bar
    status: official
    coverage: national

  - id: buildings/residential_construction_investment
    title: Investment in residential buildings, new vs conversion & renovation
    description: Construction investment in residential buildings at current prices. "Umbau" covers conversion, extension, renovation, refurbishment and demolition, so energy retrofits are included but cannot be separated.
    source: bfs_construction_investment
    chart: stacked-bar
    status: official
    coverage: national

  # ---------- buildings: life-cycle data ----------
  - id: buildings/lca_ghg_structural_materials
    title: Embodied GHG of structural and envelope materials (per kg)
    description: Greenhouse gas emissions for manufacture and disposal per kg of material (KBOB v9.0 generic entries). Per kg is not a like-for-like comparison of building elements, which also depends on the amount of material needed. Biogenic carbon stored in wood is not subtracted.
    source: kbob_lca
    chart: hbar
    status: official
    coverage: national

  - id: buildings/lca_ghg_insulation_materials
    title: Embodied GHG of insulation materials (per kg)
    description: Greenhouse gas emissions for manufacture and disposal per kg (KBOB v9.0 generic entries). Densities differ strongly (per KBOB, EPS 15–40 kg/m³, wood fibre board 148 kg/m³, straw bale 215 kg/m³), so compare per m² at equal U-value before choosing a material.
    source: kbob_lca
    chart: hbar
    status: official
    coverage: national

  - id: electricity/production_by_technology
    title: Electricity production by technology
    description: Domestic gross electricity production, before subtracting the consumption of pumped-storage pumps.
    source: bfe_electricity_statistics
    chart: stacked-bar
    status: official
    coverage: national

  - id: electricity/consumption
    title: Electricity consumption
    description: National consumption is final consumption plus transmission and distribution losses. Neither includes the electricity used by pumped-storage pumps.
    source: bfe_electricity_statistics
    chart: line
    status: official
    coverage: national

  - id: electricity/cross_border_trade
    title: Electricity imports and exports
    description: Physical electricity imports and exports across the national border. Switzerland trades large volumes in both directions every year; the balance changes with hydropower and nuclear output.
    source: bfe_electricity_statistics
    chart: line
    status: official
    coverage: national

  - id: electricity/winter_balance
    title: Winter half-year, production vs consumption
    description: >-
      Domestic production and national consumption from October to March, from daily Swissgrid data
      (winter 2024 = October 2023 to March 2024). Production includes pumped storage; consumption excludes
      the pumps, so the gap approximates net imports minus pumping. The dashboard figures differ from the
      official annual statistics by up to about 3 %.
    source: bfe_swissgrid_production
    chart: line
    status: official
    coverage: national

  - id: electricity/summer_balance
    title: Summer half-year, production vs consumption
    description: The same balance from April to September, when Switzerland usually produces more than it consumes.
    source: bfe_swissgrid_production
    chart: line
    status: official
    coverage: national

  - id: electricity/winter_production_by_source
    title: Winter electricity production by source
    description: Domestic production from October to March by source, from daily Swissgrid data. Winter 2026 shows the outage of the Gösgen nuclear plant.
    source: bfe_swissgrid_production
    chart: stacked-bar
    status: official
    coverage: national

  - id: electricity/reservoir_storage
    title: Energy stored in storage lakes, weekly
    description: >-
      Electricity that the water in Swiss storage lakes could generate, every week since 2000, by region. Lakes
      fill with snow and glacier melt from May to October and are drawn down over the winter.
    source: bfe_reservoirs
    chart: stacked-area
    status: official
    coverage: national

  - id: electricity/reservoir_fill_by_week
    title: Storage lake fill level by week of the year
    description: >-
      Stored energy as a share of storage capacity in each week, for the last five years against the lowest,
      mean and highest level of the reference years. In the energy crisis winter of 2022/23 the lakes were kept
      much fuller than usual: 75 % in the first week of 2023 against a mean of 60 %.
    source: bfe_reservoirs
    chart: line
    status: official
    coverage: national

  - id: electricity/reservoir_storage_extremes
    title: Storage lakes, spring low and autumn high
    description: >-
      Lowest stored energy of each year (in April or May, before the melt) and highest (September to November),
      against the storage capacity, which grew as dams were raised.
    source: bfe_reservoirs
    chart: line
    status: official
    coverage: national

  - id: electricity/hydro_monthly
    title: Monthly hydropower production and pumping
    description: >-
      Electricity from run-of-river and storage plants each month, and the electricity used by storage pumps.
      Both peak in June and July with the melt. Storage plants keep producing through the winter, when
      run-of-river output is lowest, and pumps run most in summer. Recent months are provisional.
    source: bfe_electricity_monthly
    chart: line
    status: official
    coverage: national

  - id: renewables/production_by_source
    title: Domestic renewable energy production by source
    description: Primary production of renewable energy in Switzerland. Solar covers PV and solar thermal. Ambient heat is the environmental heat used by heat pumps (their electricity input is not included).
    source: bfe_renewable_statistics
    chart: stacked-area
    status: official
    coverage: national

  - id: renewables/new_renewable_electricity
    title: Electricity from new renewables
    description: Gross electricity production from renewables other than hydropower.
    source: bfe_electricity_statistics
    chart: stacked-bar
    status: official
    coverage: national

  - id: renewables/wind_electricity
    title: Wind electricity production
    description: Gross electricity production from wind turbines.
    source: bfe_electricity_statistics
    chart: line
    status: official
    coverage: national

  - id: renewables/wind_farms
    title: Wind farms and their capacity
    description: >-
      Current capacity of each wind site in the plant register, labelled with its number of turbines and
      the years its turbines entered operation. The register has no farm names, so turbines within 3 km of
      each other are grouped and named after their main municipality (Mont-Crosin includes Mont-Soleil;
      Airolo is the Gotthard wind farm; Ulrichen is Gries). Years are those of the turbines now running,
      so repowered farms such as Mont-Crosin (first turbines 1996) show their newer dates.
    source: bfe_production_plants
    chart: hbar
    status: official
    coverage: national

  - id: renewables/pv_electricity
    title: Solar PV electricity production
    description: Annual gross electricity production from photovoltaics, including self-consumed electricity.
    source: bfe_electricity_statistics
    chart: line
    status: official
    coverage: national

  - id: renewables/wind_biomass_installed_capacity
    title: Installed wind and biomass capacity
    description: Cumulative electrical capacity of wind and biomass plants in the register, by year of commissioning. Only plants still in operation are counted, at their current power, so earlier years are slightly understated.
    source: bfe_production_plants
    chart: line
    status: official
    coverage: national

  - id: renewables/pv_installed_capacity
    title: Installed solar PV capacity
    description: Cumulative capacity of PV plants in the register, by year of commissioning. Only plants still in operation are counted, at their current power, so earlier years are slightly understated.
    source: bfe_production_plants
    chart: line
    status: official
    coverage: national

  - id: renewables/pv_per_building_by_canton
    title: Solar PV capacity per building, by canton
    description: >-
      Installed PV capacity in the plant register divided by the number of existing buildings in the
      building register (GWR), per canton. A rough measure of how far rooftop PV has spread; it counts
      ground-mounted and facade plants too, and does not account for building size.
    source: bfe_production_plants
    chart: hbar
    status: official
    coverage: national

  - id: renewables/solar_potential_buildings
    title: Solar potential of buildings vs today's PV production
    description: >-
      Annual solar potential of all Swiss roofs and facades, from the roof-by-roof and facade-by-facade
      ratings of sonnendach.ch and sonnenfassade.ch, in SFOE's scenarios, compared with current PV production.
      "PV next to solar heat" uses the best roof section of each building for solar heat (shown separately)
      and the rest for PV.
    source: bfe_solar_potential
    chart: hbar
    status: official
    coverage: national

  - id: renewables/solar_potential_by_canton
    title: Rooftop solar electricity potential by canton
    description: Annual PV potential if all suitable roofs were used for PV (SFOE scenario 1), summed by canton.
    source: bfe_solar_potential
    chart: hbar
    status: official
    coverage: national

  - id: renewables/glacier_mass_balance
    title: Cumulative glacier mass balance since 1915
    description: >-
      Ice and snow gained or lost since 1915, as metres of water spread over each glacier's area (m w.e.), for
      the two glaciers measured every year since then. Each hydrological year runs from October to September.
      The water that glaciers lose adds to summer runoff into hydropower reservoirs and rivers.
    source: glamos
    chart: line
    status: official
    coverage: regional
    region: Great Aletsch (VS) and Silvretta (GR) glaciers

  - id: renewables/glacier_length_change
    title: Cumulative glacier length change since 1880
    description: >-
      Retreat of the glacier tongue since the first survey, for four large glaciers measured since about 1880.
      Lines join surveys that are a few years apart.
    source: glamos
    chart: line
    status: official
    coverage: regional
    region: Four glaciers in the Alps (VS, GR)
    span_gaps: true

  - id: renewables/snow_cover_days
    title: Days with snow cover per winter
    description: >-
      Days with measurable snow on the ground from August to July (2026 = August 2025 to July 2026), at four
      stations from 911 to 2691 m. A gap marks a year with too few measurements.
    source: meteoswiss_snow
    chart: line
    status: official
    coverage: regional
    region: Four stations (GR, AI, SZ)

  - id: renewables/waegital_snow_water_equivalent
    title: Water stored in the snow on 1 April, Wägital catchment
    description: >-
      Snow water equivalent on 1 April in the catchment of the Wägitalersee storage lake, by elevation zone:
      the water that will melt into the lake in spring. The longest open series of its kind in Switzerland.
    source: meteodat_waegital_swe
    chart: stacked-bar
    status: official
    coverage: regional
    region: Wägital catchment (SZ)

  - id: heat/district_heat_by_sector
    title: District heat consumption by sector
    description: Final consumption of district heat from the national energy balance. Network losses and the plants' own use are not included.
    source: bfe_energy_statistics
    chart: stacked-area
    status: official
    coverage: national

  - id: heat/renewable_district_heat_by_source
    title: Renewable district heat by source
    description: Production of district heat counted as renewable. Only the renewable (biogenic) share of the heat from waste incineration, about half, is included; heat pumps and fossil inputs are not part of this balance.
    source: bfe_renewable_statistics
    chart: stacked-area
    status: official
    coverage: national

  - id: heat/thermal_networks_power_by_source
    title: Thermal networks by main energy source
    description: Installed heating power of the district heating and cooling networks in the SFOE register, by the main energy source reported by the operator. Networks that report no power are left out.
    source: bfe_thermal_networks
    chart: hbar
    status: official
    coverage: national

  - id: heat/thermal_networks_by_commissioning
    title: Growth of thermal networks
    description: Cumulative number of networks still in operation, by year of commissioning and main energy source. Networks without a commissioning year (about a quarter) and closed networks are not counted, so the totals are lower bounds.
    source: bfe_thermal_networks
    chart: stacked-area
    status: official
    coverage: national

  - id: electricity/pv_installations_by_self_consumption
    title: PV installations by self-consumption
    description: Number of PV installations at the end of each year, by whether the owner uses the electricity on site, shares it within a ZEV, or feeds it all into the grid. From the SFOE survey of distribution system operators; SFOE notes that plausibility checks were not fully possible.
    source: bfe_self_consumption_survey
    chart: stacked-bar
    status: official
    coverage: national

  - id: electricity/pv_capacity_by_self_consumption
    title: PV capacity by self-consumption
    description: Installed AC inverter power of the same PV installations, in MW. Installations in a ZEV are larger than single-site ones on average (apartment and commercial buildings).
    source: bfe_self_consumption_survey
    chart: stacked-bar
    status: official
    coverage: national

  - id: mobility/plug_in_share
    title: Share of plug-in cars
    description: Battery-electric and plug-in hybrid cars as a share of new passenger car registrations and of the passenger car stock.
    source: bfs_vehicles
    chart: line
    status: official
    coverage: national

  - id: mobility/new_cars_by_fuel
    title: New passenger cars by propulsion
    description: New passenger cars registered each year (new vehicles only, not used imports). Hybrids that cannot be plugged in are shown separately from plug-in hybrids.
    source: bfs_vehicles
    chart: stacked-bar
    status: official
    coverage: national

  - id: mobility/electric_car_stock
    title: Electric cars on the road
    description: Battery-electric (including range extenders) and plug-in hybrid passenger cars in the stock on 30 September. From 2018 cars with a foreign holder address are included (about 0.3 %).
    source: bfs_vehicles
    chart: stacked-area
    status: official
    coverage: national

  - id: mobility/public_charging_stations
    title: Public charging infrastructure
    description: Public charging stations and the sites they are grouped at, in December of each year, as reported to ich-tanke-strom.ch. A station can have several charging points. Operators not connected to the platform are missing.
    source: bfe_charging_infrastructure
    chart: line
    status: official
    coverage: national

  - id: emissions/ghg_by_sector
    title: Greenhouse gas emissions by sector
    description: Domestic greenhouse gas emissions in CO2 equivalents, by sector of the CO2 Ordinance. Buildings are heating and hot water in households and services; industry includes waste incineration. International aviation and shipping and the land-use balance are not included.
    source: foen_ghg_inventory
    chart: stacked-area
    status: official
    coverage: national

  - id: emissions/ghg_by_gas
    title: Greenhouse gas emissions by gas
    description: The same national total by gas. Methane and nitrous oxide come mostly from agriculture; synthetic gases are mainly refrigerants (HFCs).
    source: foen_ghg_inventory
    chart: stacked-area
    status: official
    coverage: national

  - id: scenarios/cross_solar_2050
    title: Solar electricity in 2050, by model
    description: >-
      Solar PV production in 2050 in nine Swiss energy system models, all in the same harmonised net-zero
      scenario (SWEET CROSS v2022-09, CO2 offsetting abroad, electricity market integrated with the EU).
    source: sweet_cross_results
    chart: hbar
    status: official
    coverage: national

  - id: scenarios/cross_wind_2050
    title: Wind electricity in 2050, by model
    description: Wind production in 2050 in the same scenario. Two models build none, one more than 10 TWh.
    source: sweet_cross_results
    chart: hbar
    status: official
    coverage: national

  - id: scenarios/cross_net_imports_2050
    title: Net electricity imports in 2050, by model
    description: Annual net imports in the same scenario, for the models that report them.
    source: sweet_cross_results
    chart: hbar
    status: official
    coverage: national
