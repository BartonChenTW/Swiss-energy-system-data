# Data sources. Each dataset in datasets.yml refers to one of these ids.
#
#   id:         short snake_case id, also the folder name under data/raw/
#   downloads:  optional list of {url, filename} fetched by `python -m pipeline.fetch`
#
# URLs are starting points — verify them (and the terms of use) before relying on them.

sources:
  - id: bfe_energy_statistics
    name: Overall Energy Statistics (Gesamtenergiestatistik)
    publisher: Swiss Federal Office of Energy (SFOE / BFE)
    theme: national
    url: https://www.bfe.admin.ch/bfe/en/home/supply/statistics-and-geodata/energy-statistics/overall-energy-statistics.html
    frequency: annual
    terms: TBD
    downloads: []   # TODO: add the OGD CSV links from opendata.swiss

  - id: bfe_electricity_statistics
    name: Swiss Electricity Statistics (Elektrizitätsstatistik)
    publisher: Swiss Federal Office of Energy (SFOE / BFE)
    theme: electricity
    url: https://www.bfe.admin.ch/bfe/en/home/supply/statistics-and-geodata/energy-statistics/electricity-statistics.html
    frequency: annual
    terms: TBD
    downloads: []

  - id: bfe_renewable_statistics
    name: Swiss Renewable Energy Statistics / Solar Energy Statistics
    publisher: Swiss Federal Office of Energy (SFOE / BFE)
    theme: renewables
    url: https://www.bfe.admin.ch/bfe/en/home/supply/statistics-and-geodata/energy-statistics.html
    frequency: annual
    terms: TBD
    downloads: []

  - id: bfe_production_plants
    name: Electricity production plants in Switzerland
    publisher: Swiss Federal Office of Energy (SFOE / BFE)
    theme: renewables
    url: https://opendata.swiss/en/organization/bundesamt-fur-energie-bfe
    frequency: continuous
    terms: TBD
    downloads: []

  - id: bfs_gwr
    name: Federal Register of Buildings and Dwellings (GWR / RegBL)
    publisher: Federal Statistical Office (FSO / BFS)
    theme: buildings
    url: https://www.housing-stat.ch/
    frequency: continuous
    terms: TBD
    downloads:
      - url: https://public.madd.bfs.admin.ch/ch.zip
        filename: ch.zip

  - id: swissgrid
    name: Swissgrid energy overview (grid data)
    publisher: Swissgrid
    theme: electricity
    url: https://www.swissgrid.ch/en/home/operation/grid-data.html
    frequency: 15-minute / monthly
    terms: TBD
    downloads: []

  - id: elcom_tariffs
    name: Electricity tariffs by municipality
    publisher: Federal Electricity Commission (ElCom)
    theme: electricity
    url: https://www.strompreis.elcom.admin.ch/
    frequency: annual
    terms: TBD
    downloads: []

  - id: sonnendach
    name: Solar potential of Swiss roofs (sonnendach.ch)
    publisher: Swiss Federal Office of Energy (SFOE / BFE)
    theme: renewables
    url: https://www.sonnendach.ch/
    frequency: irregular
    terms: TBD
    downloads: []

  - id: foen_ghg_inventory
    name: Switzerland's Greenhouse Gas Inventory
    publisher: Federal Office for the Environment (FOEN / BAFU)
    theme: emissions
    url: https://www.bafu.admin.ch/bafu/en/home/topics/climate/state/data/climate-reporting/greenhouse-gas-inventory.html
    frequency: annual
    terms: TBD
    downloads: []

  - id: bfs_vehicles
    name: Road vehicle stock
    publisher: Federal Statistical Office (FSO / BFS)
    theme: mobility
    url: https://www.bfs.admin.ch/bfs/en/home/statistics/mobility-transport.html
    frequency: annual
    terms: TBD
    downloads: []
