    terms: "opendata.swiss: Open use. Must provide the source."
    frequency: annual
    downloads:
      - url: https://data.geo.admin.ch/ch.bfe.statistik-wasserkraftanlagen/statistik-wasserkraftanlagen/statistik-wasserkraftanlagen_2056.csv.zip
        filename: statistik-wasserkraftanlagen_2056.csv.zip

  - id: elcom_tariffs
    status: planned
    planned_for: Electricity page – median household electricity price and its components (grid, energy, levies), 2011–next year
    name: Median Strompreis für die Schweiz (ElCom, linked data)
    publisher: Federal Electricity Commission (ElCom)
    theme: prices
    url: https://opendata.swiss/de/dataset/median-strompreis-fur-die-schweiz
    terms: "Open use (LINDAS terms of use)."
    frequency: annual
    notes: Published as a linked-data cube on LINDAS (SPARQL endpoint https://lindas.admin.ch/query); needs a query-based download.

  - id: bfs_ghg_by_sector
    status: planned
    planned_for: National page – greenhouse gas emissions by source group (transport, buildings, industry, agriculture, …)
    name: Treibhausgasemissionen nach Verursachergruppen
    publisher: Federal Statistical Office (FSO / BFS), based on the FOEN inventory
    theme: emissions
    url: https://opendata.swiss/de/dataset/treibhausgasemissionen-nach-verursachergruppen4
