# Machine-readable data sources. Schema and vocabulary: catalog/README.md
#
# Convention: id == data/raw/<id>/ == pipeline/process/<id>.py

sources:
  - id: bfe_energy_statistics
    name: "Schweizerische Gesamtenergiestatistik: Energiebilanz der Schweiz"
    publisher: Swiss Federal Office of Energy (SFOE / BFE)
    theme: national
    url: https://opendata.swiss/en/dataset/energiebilanz-der-schweiz
    terms: "opendata.swiss: Open use. Must provide the source."
    frequency: annual
    downloads:
      - url: https://www.uvek-gis.admin.ch/BFE/ogd/115/ogd115_gest_bilanz.csv
        filename: ogd115_gest_bilanz.csv
    notes: Full national energy balance in TJ from 1980, by balance item (Rubrik) and energy carrier.

  - id: bfe_electricity_statistics
    name: "Schweizerische Elektrizitätsstatistik: Elektrizitätsbilanz – Jahreswerte"
    publisher: Swiss Federal Office of Energy (SFOE / BFE)
    theme: electricity
    url: https://opendata.swiss/en/dataset/schweizerische-elektrizitatsbilanz-jahreswerte
    terms: "opendata.swiss: Open use. Must provide the source."
    frequency: annual
    downloads:
      - url: https://www.uvek-gis.admin.ch/BFE/ogd/32/ogd32_elektrizitaetbilanz_jahreswerte.csv
        filename: ogd32_elektrizitaetbilanz_jahreswerte.csv
    notes: >-
      Annual electricity balance in GWh from 1960. Breakdown of thermal and new
      renewables starts in 1990. Production columns are gross of pumped-storage consumption.

  - id: bfe_renewable_statistics
    name: "Schweizerische Gesamtenergiestatistik: Energiebilanz der erneuerbaren Energien"
    publisher: Swiss Federal Office of Energy (SFOE / BFE)
    theme: renewables
    url: https://opendata.swiss/en/dataset/schweizerische-gesamtenergiestatistik-energiebilanz-der-erneuerbaren-energien-der-schweiz
    terms: "opendata.swiss: Open use. Must provide the source."
    frequency: annual
    downloads:
      - url: https://www.uvek-gis.admin.ch/BFE/ogd/123/ogd123_Energiebilanz_erneuerbareEnergien.csv
        filename: ogd123_Energiebilanz_erneuerbareEnergien.csv
    notes: Energy balance of renewables in TJ from 1990 (hydro, solar, wind, wood, biogas, ambient heat, ...).

  - id: bfe_production_plants
    name: Elektrizitätsproduktionsanlagen
    publisher: Swiss Federal Office of Energy (SFOE / BFE)
    theme: renewables
    url: https://opendata.swiss/en/dataset/elektrizitatsproduktionsanlagen
    terms: "opendata.swiss: Open use. Must provide the source."
    frequency: monthly
    downloads:
      - url: https://data.geo.admin.ch/ch.bfe.elektrizitaetsproduktionsanlagen/csv/2056/ch.bfe.elektrizitaetsproduktionsanlagen.zip
        filename: ch.bfe.elektrizitaetsproduktionsanlagen.zip
    notes: >-
      Register of plants in operation (from the guarantee-of-origin system), with
      commissioning date and current power in kW. Decommissioned plants are not included.

  - id: bfs_gwr
    name: Federal Register of Buildings and Dwellings (GWR / RegBL)
    publisher: Federal Statistical Office (FSO / BFS)
    theme: buildings
    url: https://www.housing-stat.ch/
    terms: "Free use, commercial and non-commercial. Source must be cited: Bundesamt für Statistik; Eidg. Gebäude- und Wohnungsregister (license.pdf in the download)."
    frequency: daily
    downloads:
      - url: https://public.madd.bfs.admin.ch/ch.zip
        filename: ch.zip
    notes: >-
      ~950 MB zip with buildings, entrances and dwellings (tab-separated) plus a code
      table (kodes_codes_codici.csv). Heating fields are often missing or undetermined.

  - id: bfe_swissgrid_production
    name: "energiedashboard.ch: Stromproduktion Swissgrid"
    publisher: Swiss Federal Office of Energy (SFOE / BFE)
    theme: electricity
    url: https://opendata.swiss/en/dataset/energiedashboard-ch-stromproduktion-swissgrid
    terms: "opendata.swiss: Open use. Must provide the source."
    frequency: daily
    downloads:
      - url: https://www.bfe-ogd.ch/ogd104_stromproduktion_swissgrid.csv
        filename: ogd104_stromproduktion_swissgrid.csv

  - id: bfe_swissgrid_consumption
    name: "energiedashboard.ch: Landesverbrauch und Endverbrauch"
    publisher: Swiss Federal Office of Energy (SFOE / BFE)
    theme: electricity
    url: https://opendata.swiss/en/dataset/energiedashboard-ch-landesverbrauch-und-endverbrauch
    terms: "opendata.swiss: Open use. Must provide the source."
    frequency: daily
    downloads:
      - url: https://www.bfe-ogd.ch/ogd103_stromverbrauch_swissgrid_lv_und_endv.csv
        filename: ogd103_stromverbrauch_swissgrid_lv_und_endv.csv

  - id: elcom_tariffs
    name: Electricity tariffs by municipality
    publisher: Federal Electricity Commission (ElCom)
    theme: prices
    url: https://www.strompreis.elcom.admin.ch/
    terms: TBD
    frequency: annual

  - id: foen_ghg_inventory
    name: Switzerland's Greenhouse Gas Inventory
    publisher: Federal Office for the Environment (FOEN / BAFU)
    theme: emissions
    url: https://www.bafu.admin.ch/en/climate
    terms: TBD
    frequency: annual

  - id: bfs_vehicles
    name: Road vehicle stock
    publisher: Federal Statistical Office (FSO / BFS)
    theme: mobility
    url: https://www.bfs.admin.ch/bfs/en/home/statistics/mobility-transport.html
    terms: TBD
    frequency: annual
