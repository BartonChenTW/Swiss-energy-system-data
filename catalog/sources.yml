# Machine-readable data sources. Schema and vocabulary: catalog/README.md
#
# Convention: id == data/raw/<id>/ == pipeline/process/<id>.py

sources:
  - id: bfe_energy_statistics
    name: "Schweizerische Gesamtenergiestatistik: Energiebilanz der Schweiz"
    publisher: Swiss Federal Office of Energy (SFOE / BFE)
    theme: national
    url: https://opendata.swiss/en/dataset/energiebilanz-der-schweiz
    terms: "opendata.swiss: Open use. Must provide the source."
    frequency: annual
    downloads:
      - url: https://www.uvek-gis.admin.ch/BFE/ogd/115/ogd115_gest_bilanz.csv
        filename: ogd115_gest_bilanz.csv
    notes: Full national energy balance in TJ from 1980, by balance item (Rubrik) and energy carrier.

  - id: bfe_electricity_statistics
    name: "Schweizerische Elektrizitätsstatistik: Elektrizitätsbilanz – Jahreswerte"
    publisher: Swiss Federal Office of Energy (SFOE / BFE)
    theme: electricity
    url: https://opendata.swiss/en/dataset/schweizerische-elektrizitatsbilanz-jahreswerte
    terms: "opendata.swiss: Open use. Must provide the source."
    frequency: annual
    downloads:
      - url: https://www.uvek-gis.admin.ch/BFE/ogd/32/ogd32_elektrizitaetbilanz_jahreswerte.csv
        filename: ogd32_elektrizitaetbilanz_jahreswerte.csv
    notes: >-
      Annual electricity balance in GWh from 1960. Breakdown of thermal and new
      renewables starts in 1990. Production columns are gross of pumped-storage consumption.

  - id: bfe_renewable_statistics
    name: "Schweizerische Gesamtenergiestatistik: Energiebilanz der erneuerbaren Energien"
    publisher: Swiss Federal Office of Energy (SFOE / BFE)
    theme: renewables
    url: https://opendata.swiss/en/dataset/schweizerische-gesamtenergiestatistik-energiebilanz-der-erneuerbaren-energien-der-schweiz
    terms: "opendata.swiss: Open use. Must provide the source."
    frequency: annual
    downloads:
      - url: https://www.uvek-gis.admin.ch/BFE/ogd/123/ogd123_Energiebilanz_erneuerbareEnergien.csv
        filename: ogd123_Energiebilanz_erneuerbareEnergien.csv
    notes: Energy balance of renewables in TJ from 1990 (hydro, solar, wind, wood, biogas, ambient heat, ...).

  - id: bfe_production_plants
    name: Elektrizitätsproduktionsanlagen
    publisher: Swiss Federal Office of Energy (SFOE / BFE)
    theme: renewables
    url: https://opendata.swiss/en/dataset/elektrizitatsproduktionsanlagen
    terms: "opendata.swiss: Open use. Must provide the source."
    frequency: monthly
    downloads:
      - url: https://data.geo.admin.ch/ch.bfe.elektrizitaetsproduktionsanlagen/csv/2056/ch.bfe.elektrizitaetsproduktionsanlagen.zip
        filename: ch.bfe.elektrizitaetsproduktionsanlagen.zip
    notes: >-
      Register of plants in operation (from the guarantee-of-origin system), with
      commissioning date and current power in kW. Decommissioned plants are not included.

  - id: bfe_solar_potential
    name: Solarenergiepotenziale der Schweizer Gemeinden (Dächer und Fassaden)
    publisher: Swiss Federal Office of Energy (SFOE / BFE)
    theme: renewables
    url: https://opendata.swiss/de/dataset/solarenergiepotenziale-der-schweizer-gemeinden
    terms: "opendata.swiss: Open use. Must provide the source."
    frequency: irregular (last update April 2023)
    downloads:
      - url: https://www.bfe-ogd.ch/ogd52/Solarenergiepotenziale_Gemeinden_Daecher_und_Fassaden.csv
        filename: Solarenergiepotenziale_Gemeinden_Daecher_und_Fassaden.csv
    notes: >-
      Solar electricity and heat potential per municipality, summed from the roof-by-roof (sonnendach.ch)
      and facade-by-facade (sonnenfassade.ch) potentials, with monthly values. Scenarios 1 and 3 use all
      roofs (and facades) for PV; scenarios 2 and 4 use the best roof section of each building for solar
      heat and the rest for PV. Includes 11 municipalities of Liechtenstein.

  - id: sweet_cross_results
    name: Results CROSS scenarios v2022-09
    publisher: SWEET CROSS (Coordination of Scenarios in SWEET), ETH Zurich Energy Science Center, funded by SFOE
    theme: scenarios
    url: https://sweet-cross.ch/scenarios
    terms: Creative Commons Attribution 4.0 (CC BY 4.0)
    frequency: irregular (package of 2024-12-05)
    downloads:
      - url: https://sweet-cross.ch/api/media/file/results-cross-scenarios-2024-12-05.zip
        filename: results-cross-scenarios-2024-12-05.zip
    notes: >-
      Results for 2050 of nine Swiss energy system models (Calliope, EXPANSE, Nexus-e, SES, SES-ETH,
      STEM, SecMOD, VSE/Empa, EP2050+ ZERO Basis) in four harmonised net-zero scenarios: CO2 offsetting
      abroad or domestic, electricity market integrated with the EU ("together") or not ("alone").
      Not every model ran every scenario or reports every variable.

  - id: bfe_thermal_networks
    name: "Thermische Netze (Nahwärme, Fernwärme, Fernkälte)"
    publisher: Swiss Federal Office of Energy (SFOE / BFE)
    theme: heat
    url: https://opendata.swiss/de/dataset/thermische-netze-nahwarme-fernwarme-fernkalte
    terms: "opendata.swiss: Open use. Must provide the source."
    frequency: weekly
    downloads:
      - url: https://data.geo.admin.ch/ch.bfe.thermische-netze/csv/2056/ch.bfe.thermische-netze.zip
        filename: ch.bfe.thermische-netze.zip
    notes: >-
      Register of about 1,700 district heating and cooling networks, reported by operators:
      commissioning year, power (MW), energy delivered (MWh/a), house connections, length
      and up to two energy sources. Many fields are incomplete; each value is the current state.

  - id: bfe_self_consumption_survey
    name: "Monitoring ES2050: Datenblätter Eigenverbrauch und intelligente Netzkomponenten im Strombereich"
    publisher: Swiss Federal Office of Energy (SFOE / BFE)
    theme: electricity
    url: https://www.bfe.admin.ch/de/monitoring-energiestrategie-2050
    terms: "SFOE publication; no licence stated. Cite as: Datenumfrage BFE bei Verteilnetzbetreibern."
    frequency: annual
    downloads:
      - url: https://pubdb.bfe.admin.ch/de/publication/download/12429
        filename: bfe_eigenverbrauch_datenblaetter.xlsx
    notes: >-
      Survey of distribution system operators for the Energy Strategy 2050 monitoring, one sheet
      per year from 2019: PV installations with and without self-consumption and in ZEV (count,
      AC power, surplus fed in), plus smart meters. SFOE notes that plausibility checks were not
      fully possible. The download id changes with each edition.

  - id: bfs_gwr
    name: Federal Register of Buildings and Dwellings (GWR / RegBL)
    publisher: Federal Statistical Office (FSO / BFS)
    theme: buildings
    url: https://www.housing-stat.ch/
    terms: "Free use, commercial and non-commercial. Source must be cited: Bundesamt für Statistik; Eidg. Gebäude- und Wohnungsregister (license.pdf in the download)."
    frequency: daily
    downloads:
      - url: https://public.madd.bfs.admin.ch/ch.zip
        filename: ch.zip
    notes: >-
      ~950 MB zip with buildings, entrances and dwellings (tab-separated) plus a code
      table (kodes_codes_codici.csv). Heating fields are often missing or undetermined.

  # ---------- buildings: retrofit, energy performance, life-cycle data ----------
  - id: bfe_gebaeudeprogramm
    name: "Das Gebäudeprogramm: Jahresbericht und Jahresstatistik"
    publisher: Swiss Federal Office of Energy (SFOE / BFE) and cantons (EnDK)
    theme: buildings
    url: https://opendata.swiss/de/dataset/gebaudeprogramm-jahresbericht-und-jahresstatistik
    terms: "opendata.swiss: Open use. Must provide the source."
    frequency: annual
    downloads:
      - url: https://www.uvek-gis.admin.ch/BFE/ogd/18/ogd18_gebaeudeprogramm_auszahlungen.csv
        filename: ogd18_gebaeudeprogramm_auszahlungen.csv
      - url: https://www.uvek-gis.admin.ch/BFE/ogd/18/ogd18_gebaeudeprogramm_energiewirkung.csv
        filename: ogd18_gebaeudeprogramm_energiewirkung.csv
      - url: https://www.uvek-gis.admin.ch/BFE/ogd/18/ogd18_gebaeudeprogramm_co2wirkung.csv
        filename: ogd18_gebaeudeprogramm_co2wirkung.csv
    notes: >-
      National subsidy programme for building envelope insulation, heating replacement,
      system renovation and new builds. Payouts by canton from 2017; energy and CO2
      effects (Switzerland only) from 2010, as effects over the lifetime of the measures.
      Only subsidised projects are covered.

  - id: bfe_gebaeudeprogramm_projects
    name: "Das Gebäudeprogramm: Quelldaten der Kantone für direkte Massnahmen"
    publisher: Swiss Federal Office of Energy (SFOE / BFE) and cantons (EnDK)
    theme: buildings
    url: https://opendata.swiss/de/dataset/das-gebaudeprogramm-quelldaten-der-kantone-fur-direkte-massnahmen
    terms: "opendata.swiss: Open use. Must provide the source."
    frequency: annual
    downloads:
      - url: https://www.bfe-ogd.ch/ogd128_GebPrograme_rohdaten_Kanton_direktmassnahmen.csv
        filename: ogd128_GebPrograme_rohdaten_Kanton_direktmassnahmen.csv
    notes: Anonymised project-level records (~250k) with measure code, heating system before/after, ERA and insulated areas.

  - id: bfs_construction_investment
    name: Bauinvestitionen nach Art der Arbeiten und Kategorie der Bauwerke
    publisher: Federal Statistical Office (FSO / BFS)
    theme: buildings
    url: https://opendata.swiss/de/dataset/bauinvestitionen-und-arbeitsvorrat-investitionen-nach-grossregion-kanton-gemeinde-art-der-arbei1
    terms: "opendata.swiss: Open use. Must provide the source."
    frequency: annual
    downloads:
      - url: https://www.pxweb.bfs.admin.ch/api/v1/de/px-x-0904010000_205/px-x-0904010000_205.px
        filename: px-x-0904010000_205_wohnen_ch.csv
        post:
          query:
            - code: "Grossregion (<<) / Kanton (-) / Gemeinde (......)"
              selection: {filter: item, values: ["CH"]}
            - code: Art der Arbeiten
              selection: {filter: item, values: ["1", "2"]}
            - code: Kategorie der Bauwerke
              selection: {filter: item, values: ["900"]}
            - code: Beobachtungseinheit
              selection: {filter: item, values: ["kost_j"]}
          response: {format: csv}
    notes: >-
      PXWeb API query: Switzerland, residential buildings (Wohnen), new construction vs
      Umbau (conversion, extension, renovation, refurbishment and demolition), in 1000 CHF
      at current prices. Renovation is not reported separately from other conversion work.

  - id: bafu_co2_buildings
    name: Schätzung der direkten CO2-Emissionen aufgrund des Wärmebedarfs gemäss SIA 380/1
    publisher: Federal Office for the Environment (FOEN / BAFU)
    theme: buildings
    url: https://opendata.swiss/de/dataset/schatzung-der-direkten-co-emissionen-aufgrund-des-warmebedarfs-gemass-sia-norm-380-1-2016
    terms: "opendata.swiss: Open use."
    frequency: daily
    downloads:
      - url: https://data.geo.admin.ch/ch.bafu.klima-co2_ausstoss_gebaeude/klima-co2_ausstoss_gebaeude/klima-co2_ausstoss_gebaeude_2056.csv.zip
        filename: klima-co2_ausstoss_gebaeude_2056.csv.zip
    notes: >-
      Modelled (not measured) direct CO2 emissions per building with a residential use,
      from GWR attributes and SIA 380/1 heat demand, in classes. Used by the FOEN CO2
      calculator for buildings.

  - id: bafu_cantonal_buildings_report
    name: Kantonale Berichterstattung CO2-Emissionen Gebäude (Daten)
    publisher: Federal Office for the Environment (FOEN / BAFU) and SFOE
    theme: buildings
    url: https://www.bafu.admin.ch/de/berichterstattung-gebaeude
    terms: "No licence stated on the publisher's page. Federal publication; cite FOEN/SFOE."
    frequency: irregular
    downloads:
      - url: https://www.bafu.admin.ch/dam/de/sd-web/284lFZuyXO2I/daten-kantonale-berichterstattung-co2-gebaeude-2016-2020.xlsx
        filename: daten-kantonale-berichterstattung-co2-gebaeude.xlsx
    notes: >-
      Cantonal reporting under the CO2 Act with the harmonised standard method: final
      energy, CO2 and energy reference area of the building stock, 2016–2022 (file name
      says 2016–2020; status December 2024).

  - id: ge_idc
    name: Indice de dépense de chaleur (IDC) des bâtiments – moyenne sur 2 ou 3 ans
    publisher: Canton de Genève, Office cantonal de l'énergie (OCEN), via SITG
    theme: buildings
    url: https://opendata.swiss/fr/dataset/indice-de-depense-de-chaleur-idc-des-batiments-moyenne-sur-2-ou-3-ans
    terms: "opendata.swiss: Open use."
    frequency: daily
    downloads:
      - url: https://ge.ch/sitg/geodata/SITG/OPENDATA/SCANE_INDICE_MOYENNES_3_ANS-CSV.zip
        filename: SCANE_INDICE_MOYENNES_3_ANS-CSV.zip
    notes: >-
      Measured heating (and hot water) energy per heated floor area (SRE) for buildings
      that must report under Geneva law, in MJ/m²·a, per building and year. Geneva only.

  - id: lu_geak
    name: Gebäudeenergieausweis der Kantone (GEAK) öffentlich – Kanton Luzern
    publisher: Kanton Luzern, Umwelt und Energie (uwe)
    theme: buildings
    url: https://opendata.swiss/de/dataset/gebaudeenergieausweis-der-kantone-geak-offentlich
    terms: "opendata.swiss: Open use."
    frequency: quarterly
    downloads:
      - url: "https://public.geo.lu.ch/ogd/rest/services/managed/GEAKPUBX_DS_V2_MP/MapServer/56/query?where=1%3D1&outFields=GEAK_NR,EGID,BEW_HUELLE,BEW_GESAMT,BEW_EMISS,GEB_KAT,GEAK_TYP,DATEOFCREA&returnGeometry=false&f=json"
        filename: geak_luzern.json
    notes: >-
      Published energy performance certificates (GEAK) of buildings in Lucerne issued
      since 2019, with envelope, overall and CO2 class (A–G). The only canton publishing
      GEAK results as open data at this level; not representative of Switzerland.

  - id: minergie_buildings
    name: Anzahl Minergie-Gebäude in Gemeinden
    publisher: Swiss Federal Office of Energy (SFOE / BFE), data from Minergie
    theme: buildings
    url: https://opendata.swiss/de/dataset/anzahl-minergie-gebaude-in-gemeinden
    terms: "opendata.swiss: Open use. Must provide the source."
    frequency: irregular
    downloads:
      - url: https://data.geo.admin.ch/ch.bfe.minergiegebaeude/ogd/ogd91_minergiegebaeude_pro_gemeinde.csv
        filename: ogd91_minergiegebaeude_pro_gemeinde.csv
    notes: >-
      Current snapshot of Minergie-certified buildings per municipality by label. Sums to
      ~33k buildings, while Minergie reports ~60k certified buildings (annual report 2025);
      the difference is not explained in the dataset.

  - id: kbob_lca
    name: KBOB/ecobau/IPB-Liste Ökobilanzdaten im Baubereich (v9.0)
    publisher: KBOB, ecobau, IPB
    theme: buildings
    url: https://www.kbob.admin.ch/de/oekobilanzdaten-im-baubereich
    terms: "Provided free of charge (kostenlos); no explicit licence stated. Cite KBOB/ecobau/IPB."
    frequency: irregular
    downloads:
      - url: https://www.kbob.admin.ch/dam/de/sd-web/GUOl1trUNEVH/%C3%96kobilanzdaten_im_Baubereich_V9.0.xlsx
        filename: Oekobilanzdaten_im_Baubereich_V9.0.xlsx
    notes: >-
      Swiss reference LCA data for building materials, building services, energy,
      transport and disposal: UBP'21, primary energy (grey energy) and GHG emissions per
      functional unit. Version 9.0 published July 2026. CESAR-P uses the 2014 edition.

  - id: bfe_swissgrid_production
    name: "energiedashboard.ch: Stromproduktion Swissgrid"
    publisher: Swiss Federal Office of Energy (SFOE / BFE)
    theme: electricity
    url: https://opendata.swiss/en/dataset/energiedashboard-ch-stromproduktion-swissgrid
    terms: "opendata.swiss: Open use. Must provide the source."
    frequency: daily
    downloads:
      - url: https://www.bfe-ogd.ch/ogd104_stromproduktion_swissgrid.csv
        filename: ogd104_stromproduktion_swissgrid.csv

  - id: bfe_swissgrid_consumption
    name: "energiedashboard.ch: Landesverbrauch und Endverbrauch"
    publisher: Swiss Federal Office of Energy (SFOE / BFE)
    theme: electricity
    url: https://opendata.swiss/en/dataset/energiedashboard-ch-landesverbrauch-und-endverbrauch
    terms: "opendata.swiss: Open use. Must provide the source."
    frequency: daily
    downloads:
      - url: https://www.bfe-ogd.ch/ogd103_stromverbrauch_swissgrid_lv_und_endv.csv
        filename: ogd103_stromverbrauch_swissgrid_lv_und_endv.csv

  - id: glamos
    name: Swiss Glacier Mass Balance and Swiss Glacier Length Change (release 2025)
    publisher: Glacier Monitoring Switzerland (GLAMOS), on behalf of FOEN, MeteoSwiss and SCNAT
    theme: renewables
    url: https://www.glamos.ch/en/downloads
    terms: >-
      "Freely available and may be used with indication of the source for scientific and non-commercial use."
      Cite GLAMOS (2025), doi:10.18750/massbalance.2025.r2025 and doi:10.18750/lengthchange.2025.r2025.
      Not an open licence: commercial reuse needs permission.
    frequency: annual (new release each autumn)
    downloads:
      - url: https://doi.glamos.ch/data/massbalance/massbalance_fixdate.csv
        filename: massbalance_fixdate.csv
      - url: https://doi.glamos.ch/data/lengthchange/lengthchange.csv
        filename: lengthchange.csv
    notes: >-
      Glaciological mass balance of about 30 glaciers per year (three since 1915), in mm water equivalent per
      hydrological year (October–September), and length change of about 100 glacier tongues since 1880. Each
      CSV starts with a licence header and three header rows (names, codes, units); the last column (observer)
      contains commas. Also on the page: inventories (shapefiles) and geodetic volume change.

  - id: meteoswiss_snow
    name: "Manual precipitation stations – measurement values (ogd-nime): yearly snow values"
    publisher: Federal Office of Meteorology and Climatology (MeteoSwiss)
    theme: renewables
    url: https://data.geo.admin.ch/api/stac/v1/collections/ch.meteoschweiz.ogd-nime
    terms: "Creative Commons Attribution 4.0 (CC BY 4.0). Source: MeteoSwiss."
    frequency: yearly file updated daily
    downloads:
      - url: https://data.geo.admin.ch/ch.meteoschweiz.ogd-nime/wfj/ogd-nime_wfj_y.csv
        filename: ogd-nime_wfj_y.csv
      - url: https://data.geo.admin.ch/ch.meteoschweiz.ogd-nime/sae/ogd-nime_sae_y.csv
        filename: ogd-nime_sae_y.csv
      - url: https://data.geo.admin.ch/ch.meteoschweiz.ogd-nime/sia/ogd-nime_sia_y.csv
        filename: ogd-nime_sia_y.csv
      - url: https://data.geo.admin.ch/ch.meteoschweiz.ogd-nime/ein/ogd-nime_ein_y.csv
        filename: ogd-nime_ein_y.csv
    notes: >-
      One file per station, semicolon-separated, Latin-1. Parameters ending in l0 are sums or means over the
      snow year August–July, stamped with the year it ends. About 270 stations; the four downloaded here
      (Weissfluhjoch, Säntis, Segl-Maria, Einsiedeln) have long, nearly complete snow series at different
      altitudes. Daily snow depth and new snow are in the _d_ files of the same collection.

  - id: meteodat_waegital_swe
    name: Snow water equivalent for reference date April 1 for Wägital catchment, 1943–2026
    publisher: Meteodat GmbH, with MeteoSwiss (GCOS Switzerland), SLF, University of Zurich, ETH Zurich and AG Kraftwerk Wägital
    theme: renewables
    url: https://doi.org/10.5281/zenodo.19589752
    terms: Creative Commons Attribution 4.0 (CC BY 4.0). Cite Lorenzi et al. (2026), Zenodo.
    frequency: annual (new Zenodo version each April)
    downloads:
      - url: https://zenodo.org/api/records/19589752/files/Waegital_1943-2026.txt/content
        filename: Waegital_1943-2026.txt
    notes: >-
      Water stored in the snow cover on 1 April in the catchment of the Wägitalersee storage lake (canton of
      Schwyz), in million m³, for 900–1500 and 1500–2300 m. The longest open snow water equivalent series in
      Switzerland. Each yearly update is a new Zenodo record, so the download URL changes.

  - id: bfe_reservoirs
    name: "ENSTAT: Füllungsgrad der Speicherseen (Wochenbericht)"
    publisher: Swiss Federal Office of Energy (SFOE / BFE)
    theme: electricity
    url: https://opendata.swiss/de/dataset/enstat-fullungsgrad-der-speicherseen-sonntag-24h-wochenbericht-speicherinhalt
    terms: "opendata.swiss: Open use. Must provide the source."
    frequency: weekly
    downloads:
      - url: https://www.bfe-ogd.ch/ogd17/ogd17_fuellungsgrad_speicherseen.csv
        filename: ogd17_fuellungsgrad_speicherseen.csv
    notes: >-
      Energy stored in the storage lakes in GWh (the electricity their water could generate) and the maximum
      storage content, weekly from 2000, for Valais, Graubünden, Ticino and the rest of Switzerland. Dates are
      Mondays; the measurement is taken on the Sunday before at 24:00.

  - id: bfe_electricity_monthly
    name: "ENSTAT: Elektrizitätsbilanz der Schweiz – Monatswerte"
    publisher: Swiss Federal Office of Energy (SFOE / BFE)
    theme: electricity
    url: https://opendata.swiss/de/dataset/enstat-elektrizitatsbilanz-der-schweiz-monatswerte-csv
    terms: "opendata.swiss: Open use. Must provide the source."
    frequency: monthly
    downloads:
      - url: https://www.bfe-ogd.ch/ogd35/ogd35_schweizerische_elektrizitaetsbilanz_monatswerte.csv
        filename: ogd35_schweizerische_elektrizitaetsbilanz_monatswerte.csv
    notes: >-
      Monthly electricity balance in GWh from 2000: production by plant type (run-of-river, storage, nuclear,
      thermal, wind, PV), storage pump consumption, imports, exports and consumption. Recent months are
      provisional (Definitiv = 0); missing values are written NULL.

