name: Update data

# Re-fetch sources and re-run processors; opens a PR if processed data changed.
on:
  schedule:
    - cron: "0 5 1 * *"   # 05:00 UTC on the 1st of each month
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - run: python -m pipeline.fetch --force
      - run: python -m pipeline.process
      - run: python -m pipeline.check        # fails the run if the catalog or a processed CSV is invalid
      - uses: peter-evans/create-pull-request@v6
        with:
          branch: data-update
          commit-message: "Update processed data"
          title: "Monthly data update"
          body: "Automated re-fetch of sources in `catalog/sources.yml`. Review the diff in `data/processed/` (CSVs and `.meta.json` provenance) before merging."
          add-paths: data/processed
