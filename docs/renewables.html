<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Renewables · Swiss Energy System Data</title>
  <link rel="stylesheet" href="assets/style.css">
</head>
<body>
  <header id="site-header"></header>
  <main class="wrap">
    <h1>Renewables</h1>
    <p class="lede">Hydropower still provides most of Switzerland's renewable energy. Growth now comes
      from solar PV, ambient heat used by heat pumps, and wood. Wind remains small.</p>

    <div class="grid">
      <div class="chart" data-dataset="renewables/production_by_source"></div>
      <div class="chart" data-dataset="renewables/new_renewable_electricity"></div>
    </div>

    <h2>Solar PV</h2>
    <div class="grid">
      <div class="chart" data-dataset="renewables/pv_installed_capacity"></div>
    </div>

    <h2>Wind and biomass</h2>
    <div class="grid">
      <div class="chart" data-dataset="renewables/wind_electricity"></div>
      <div class="chart" data-dataset="renewables/wind_biomass_installed_capacity"></div>
    </div>
  </main>
  <footer id="site-footer"></footer>
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.4/dist/chart.umd.min.js"></script>
  <script src="assets/app.js"></script>
</body>
</html>
